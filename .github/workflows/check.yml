name: Docs check

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/check_index.py"
      - "tools/scan_secrets.py"
      - ".github/workflows/check.yml"
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - "tools/check_index.py"
      - "tools/scan_secrets.py"
      - ".github/workflows/check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Secret scan (repo)
        run: python3 tools/scan_secrets.py
      - name: HTML, contracts, JS syntax
        run: python3 tools/check_index.py docs/index.html
