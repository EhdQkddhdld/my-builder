name: ATELIER final verification
on:
  push:
    branches: ['qa/v3.3.0-atelier']
    paths: ['docs/index.html','docs/version.json','.github/workflows/atelier-r1a-qa.yml','design/atelier/qa/r1a.py','design/atelier/qa/r1b.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fingerprint and official checks
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          sha256sum docs/index.html docs/version.json > qa-evidence/SHA256.txt
          echo '3ec7eb8ca93d217767d0efd34b5981044683b54952520bb5c5c1e5a398c2c0c7  docs/index.html' | sha256sum -c -
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          python3 tools/scan_secrets.py | tee qa-evidence/security.txt
          python3 tools/check_index.py docs/index.html | tee qa-evidence/html.txt
          echo 'd714fba378925f99d7190c1f71c34853f1c96e537fd6fb1ade649f111bbc87bd  docs/version.json' | sha256sum -c -
      - name: Install test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Navigation browser tests
        run: python3 design/atelier/qa/r1a.py
      - name: Category and selected-count browser tests
        if: ${{ !cancelled() }}
        run: python3 design/atelier/qa/r1b.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-r1b-evidence
          path: qa-evidence/
          retention-days: 7
  storage-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exact candidate and generic application regressions
        run: |
          python - <<'PY'
          import hashlib, json, shutil, threading, tempfile, traceback, subprocess
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          evidence=Path('qa-regression-evidence')
          evidence.mkdir(exist_ok=True)
          html=Path('docs/index.html')
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='3ec7eb8ca93d217767d0efd34b5981044683b54952520bb5c5c1e5a398c2c0c7'
          assert hashlib.sha256(Path('docs/version.json').read_bytes()).hexdigest()=='d714fba378925f99d7190c1f71c34853f1c96e537fd6fb1ade649f111bbc87bd'
          results=[]
          fingerprints={}
          for file,expected_blob in [('docs/index.html','6109eb3e98a5d16c5d0386c2c3ea1dcf3cbd5476'),('docs/version.json','7ae004d1f246af2b128e6d3ddf7f2a7b36e0e666')]:
            blob=subprocess.check_output(['git','hash-object',file],text=True).strip()
            assert blob==expected_blob, (file,blob)
            fingerprints[file]={'blob':blob,'sha256':hashlib.sha256(Path(file).read_bytes()).hexdigest()}
          (evidence/'fingerprints.json').write_text(json.dumps(fingerprints,indent=2))
          print(json.dumps(fingerprints),flush=True)
          with tempfile.TemporaryDirectory() as td:
            root=Path(td)
            shutil.copyfile(html,root/'index.html')
            server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=td))
            threading.Thread(target=server.serve_forever,daemon=True).start()
            origin=f'http://127.0.0.1:{server.server_port}'
            try:
              with sync_playwright() as w:
                browser=w.chromium.launch()
                for width,height in [(476,660),(839,660),(840,660),(933,612)]:
                  p=None
                  phase='context setup'
                  def boot(path='index.html',normalize=True):
                    global phase
                    phase=f'boot {path}: goto'
                    p.goto(origin+'/'+path,wait_until='load')
                    phase=f'boot {path}: route readiness'
                    p.wait_for_function("typeof window.rdV30Route==='function'")
                    phase=f'boot {path}: builder route'
                    p.evaluate("rdV30Route('builder')")
                    if normalize:
                      phase=f'boot {path}: step-1'
                      p.evaluate("jumpToStep('step-1')")
                    phase=f'boot {path}: count card visibility'
                    p.locator('[data-detail=count]').wait_for(state='visible')
                  def state():return p.evaluate('JSON.stringify(captureState())')
                  def undo():return p.evaluate('undoStack.length')
                  def run(name,fn):
                    global p,phase
                    phase='context setup'
                    c=browser.new_context(viewport={'width':width,'height':height},reduced_motion='reduce',accept_downloads=True,service_workers='block')
                    errors=[]
                    try:
                      c.route('**/*',lambda r:r.continue_() if r.request.url.startswith(origin+'/') and r.request.method in ('GET','HEAD') else r.abort())
                      p=c.new_page()
                      p.set_default_timeout(12000)
                      p.on('pageerror',lambda e:errors.append(str(e)))
                      fn()
                      row={'viewport':[width,height],'test':name,'status':'PASS'}
                    except Exception as e:
                      row={'viewport':[width,height],'test':name,'status':'FAIL','phase':phase,'error_type':type(e).__name__,'error_message':str(e),'traceback':traceback.format_exc()}
                    finally:
                      c.close()
                    row['page_errors']=errors
                    if errors:row['status']='FAIL'
                    results.append(row)
                    print(json.dumps(row),flush=True)
                    (evidence/'results.json').write_text(json.dumps(results,indent=2))
                  def navigation():
                    global phase
                    boot()
                    phase='navigation state and undo'
                    initial=state()
                    u=undo()
                    p.locator('[data-detail=count]').click()
                    p.locator('#group-count .chip[data-val=solo]').click()
                    p.locator('#rd304-detail-done').click()
                    assert p.evaluate("captureState().count")=='solo'
                    assert undo()==u+1
                    selected=state()
                    p.evaluate("jumpToStep('step-2')")
                    p.locator('[data-detail=pose]').click()
                    p.locator('[data-scene-stage=category] .d32-facet').first.click()
                    assert state()==selected and undo()==u+1
                    p.locator('.d3-foot button:visible').filter(has_text='건너뛰기').click()
                    assert state()==selected and undo()==u+1
                    p.evaluate('undoLast()')
                    assert state()==initial and undo()==u
                  def storage():
                    global phase
                    boot()
                    phase='backup restore and IndexedDB reads'
                    p.evaluate("""async()=>{
                      await rd210LoadThumbs();
                      await cardThumbs.list();
                      const data={presets:[{name:'QA neutral',state:captureState()}]};
                      restoreBackup(data);
                    }""")
                    phase='backup reload and persistence'
                    before=p.evaluate('JSON.stringify(readPresets())')
                    p.reload(wait_until='load')
                    p.wait_for_function("typeof window.rdV30Route==='function'")
                    assert p.evaluate('JSON.stringify(readPresets())')==before
                    phase='backup export download'
                    with p.expect_download(timeout=20000) as di:
                      p.evaluate('()=>{void exportSettings()}')
                    phase='backup exported JSON assertions'
                    path=Path(td)/f'backup-{width}.json'
                    di.value.save_as(path)
                    data=json.loads(path.read_text())
                    assert data['presets'][0]['name']=='QA neutral'
                    assert 'artistThumbs' in data and 'cardCovers' in data
                    assert data['presets'][0]['state']['schemaVersion']==2
                    path.unlink()
                  def resave():
                    global phase
                    boot()
                    for i in (1,2):
                      phase=f'HTML generation {i}: download'
                      with p.expect_download(timeout=20000) as di:
                        p.evaluate('()=>{downloadSelfHTML()}')
                      filename=f'roundtrip-{width}-{i}.html'
                      assert di.value.suggested_filename=='My_Builder_v3.3.0.html',di.value.suggested_filename
                      di.value.save_as(root/filename)
                      phase=f'HTML generation {i}: file size'
                      assert (root/filename).stat().st_size>200000
                      boot(filename)
                      phase=f'HTML generation {i}: reopened DOM assertions'
                      assert p.locator('#group-count').count()==1
                      assert p.evaluate("typeof window.downloadSelfHTML==='function'")
                      (root/filename).unlink()
                  def reproduce():
                    global phase
                    navigation()
                    diagnostic={'viewport':[width,height],'prior_run':46038439375,'before_reload':p.locator('[data-detail=count]').is_visible()}
                    try:
                      boot(normalize=False)
                      diagnostic['outcome']='NOT_REPRODUCED'
                    except Exception as e:
                      diagnostic.update(outcome='REPRODUCED' if type(e).__name__=='TimeoutError' and phase.endswith('count card visibility') else 'OTHER_ERROR',phase=phase,error_type=type(e).__name__,error_message=str(e),traceback=traceback.format_exc())
                    diagnostic['after_legacy_boot_count_visible']=p.locator('[data-detail=count]').is_visible()
                    print(json.dumps(diagnostic),flush=True)
                    (evidence/'legacy-boot-reproduction.json').write_text(json.dumps(diagnostic,indent=2))
                    phase='reproduction recovery: explicit step-1'
                    p.evaluate("jumpToStep('step-1')")
                    p.locator('[data-detail=count]').wait_for(state='visible')
                  if width==476:run('legacy boot diagnostic and recovery',reproduce)
                  run('native app backup read, preset restore and reload',storage)
                  if width in (476,933):run('two generation HTML save and reopen',resave)
                browser.close()
            finally:
              server.shutdown()
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          assert len(results)==7, results
          assert all(r['status']=='PASS' for r in results), 'Regression failed: see results'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-regression-evidence
          path: qa-regression-evidence/
          retention-days: 7

  output-and-mocked-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Neutral output equivalence and intercepted API
        run: |
          python - <<'PY'
          import hashlib,json,subprocess,tempfile,threading,traceback,zlib,struct,shutil
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer,SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          output=Path('qa-output-evidence'); output.mkdir(exist_ok=True)
          expected='3ec7eb8ca93d217767d0efd34b5981044683b54952520bb5c5c1e5a398c2c0c7'
          baseline=subprocess.check_output(['git','show','205ba64810be7fc6e1bdeb0290f69317b925283e:docs/index.html'])
          assert hashlib.sha256(baseline).hexdigest()=='ff72dc7cb1bf9fa55f5b206ff490e56bcab90d277c6844714c32a5c6277da76b'
          assert hashlib.sha256(Path('docs/index.html').read_bytes()).hexdigest()==expected
          def digest(value):
              return hashlib.sha256(json.dumps(value,ensure_ascii=False,separators=(',',':'),sort_keys=True).encode()).hexdigest()
          results=[]
          with tempfile.TemporaryDirectory() as td:
              root=Path(td); (root/'base.html').write_bytes(baseline)
              shutil.copyfile('docs/index.html',root/'candidate.html')
              server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=td))
              threading.Thread(target=server.serve_forever,daemon=True).start()
              origin=f'http://127.0.0.1:{server.server_port}'
              try:
                  with sync_playwright() as pw:
                      browser=pw.chromium.launch()
                      def context():
                          c=browser.new_context(viewport={'width':933,'height':612},reduced_motion='reduce',service_workers='block')
                          c.add_init_script("Math.random=()=>0.5")
                          c.route('**/*',lambda r:r.continue_() if r.request.url.startswith(origin+'/') and r.request.method in ('GET','HEAD') else r.abort())
                          return c
                      def boot(c,name):
                          p=c.new_page(); errors=[]; p.on('pageerror',lambda e:errors.append(str(e)))
                          assert p.goto(origin+'/'+name+'.html',wait_until='load').ok
                          p.wait_for_function("typeof window.rdV30Route==='function'")
                          p.evaluate("rdV30Route('builder');jumpToStep('step-1')")
                          return p,errors
                      c0,c1=context(),context()
                      p0,e0=boot(c0,'base');p1,e1=boot(c1,'candidate')
                      fixture=p0.evaluate("""()=>{
                        const state=captureState();
                        const styles=readArtStyles().map(x=>x.id).filter(Boolean);
                        const lights=[...document.querySelectorAll('#group-light .chip[data-val]')].map(x=>x.dataset.val);
                        return {state,styles:styles.slice(0,4),lights};
                      }""")
                      configs=[]
                      assert fixture['styles'] and fixture['lights'], 'fixture options unavailable'
                      style=fixture['styles'][0]
                      for dot in (False,True):
                          for tone in range(5):
                              for light in ['']+fixture['lights'][:5]:
                                  configs.append({'artId':style,'style':style,'count':'solo','toneIdx':str(tone),'light':light,'dotToggleMode':dot})
                      print(f'Fixture count: {len(configs)}, available styles: {len(fixture["styles"])}, available light choices: {len(fixture["lights"])}',flush=True)
                      assert len(configs)>=22
                      observed=set()
                      for i,config in enumerate(configs):
                          state={**fixture['state'],**config,'phase':'','pose':'','shot':'','customTags':{'main':'','char1':'','male':'','uc':''}}
                          def snapshot(p):
                              return p.evaluate("""s=>{
                                applyState(s);
                                return {state:captureState(),pairs:getActiveCopyPairs(),slots:copySlots,
                                prompt:window.rdNai.readPrompt(true)};
                              }""",state)
                          x,y=snapshot(p0),snapshot(p1)
                          hx,hy=digest(x),digest(y)
                          observed.add(digest(x['state']))
                          row={'case':i+1,'base_sha256':hx,'candidate_sha256':hy,'match':hx==hy}
                          results.append(row)
                          (output/'output.json').write_text(json.dumps(results,indent=2))
                          assert hx==hy,f'output mismatch case {i+1}'
                      assert len(observed)>=22, f'only {len(observed)} distinct effective states'
                      assert not e0 and not e1, 'uncaught browser error'
                      print(f'Output comparison: {len(results)}/{len(results)} matched; {len(observed)} distinct states',flush=True)
                      c0.close();c1.close()
                      c=context();p,errors=boot(c,'candidate')
                      calls=[]
                      def chunk(kind,data):
                          return struct.pack('>I',len(data))+kind+data+struct.pack('>I',zlib.crc32(kind+data)&0xffffffff)
                      png=b'\x89PNG\r\n\x1a\n'+chunk(b'IHDR',struct.pack('>IIBBBBB',1,1,8,2,0,0,0))+chunk(b'IDAT',zlib.compress(b'\0\x80\x80\x80'))+chunk(b'IEND',b'')
                      endpoint='https://image.novelai.net/ai/generate-image'
                      def intercept(route):
                          headers={'Access-Control-Allow-Origin':'*','Access-Control-Allow-Headers':'authorization,content-type','Access-Control-Allow-Methods':'POST,OPTIONS'}
                          if route.request.method=='OPTIONS':
                              route.fulfill(status=204,headers=headers);return
                          assert route.request.method=='POST'
                          calls.append(digest(route.request.post_data_json))
                          if len(calls)==1:route.fulfill(status=200,body=png,content_type='image/png',headers=headers)
                          else:route.fulfill(status=429,body='{}',content_type='application/json',headers=headers)
                      c.route(endpoint,intercept)
                      p.evaluate("""s=>{
                        applyState(s);
                        localStorage.setItem(window.rdNai._KEY_LS,['qa','fixture'].join('-'));
                      }""",{**fixture['state'],**configs[0],'phase':'','pose':'','shot':''})
                      p.locator('#rd-atelier-dock .atelier-studio').click()
                      p.wait_for_function("rdV30Current()==='studio'")
                      assert not calls and not p.evaluate('rdNai.isBusy()')
                      p.locator('#rd-nai-go').click()
                      p.wait_for_function("!rdNai.isBusy() && document.querySelector('#rd-nai-stage.img')",timeout=15000)
                      assert len(calls)==1
                      stored=p.evaluate("""async()=>{const rows=await rdNai.galList();return {count:rows.length,persistent:rows.length===1&&!rows[0].temporary,full:rows.length===1&&!!(await rdNai.galFull(rows[0].id))}}""")
                      assert stored=={'count':1,'persistent':True,'full':True},stored
                      p.locator('#rd-nai-again').click()
                      p.wait_for_function("!rdNai.isBusy() && document.querySelector('#rd-nai-err')?.textContent.includes('429')",timeout=15000)
                      p.wait_for_timeout(1000)
                      assert len(calls)==2, 'unexpected retry'
                      assert p.evaluate("(async()=> (await rdNai.galList()).length)()")==1
                      assert p.locator('#rd-nai-dl').is_enabled(), 'prior successful image lost'
                      p.reload(wait_until='load')
                      p.wait_for_function("typeof window.rdNai?.galList==='function'")
                      assert p.evaluate("(async()=>{const rows=await rdNai.galList();return rows.length===1&&!rows[0].temporary&&!!(await rdNai.galFull(rows[0].id))})()")
                      assert not errors, 'uncaught browser error'
                      (output/'mock-api.json').write_text(json.dumps({'status':'PASS','intercepted_posts':len(calls),'actual_external_calls':0,'prior_success_retained':True,'native_gallery_reload':True,'no_retry_observed_ms':1000},indent=2))
                      print('Mock API: success, 429, previous result retained, native gallery reload PASS',flush=True)
                      c.close();browser.close()
              finally:server.shutdown()
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-output-and-api-evidence
          path: qa-output-evidence/
          retention-days: 7
