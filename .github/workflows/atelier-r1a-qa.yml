name: ATELIER isolated verification
on:
  push:
    branches: ['qa/v3.3.0-atelier']
    paths: ['docs/index.html','.github/workflows/atelier-r1a-qa.yml','design/atelier/qa/r1a.py','design/atelier/qa/r1b.py']
  pull_request:
    branches: ['qa/v3.3.0-atelier']
    types: [opened, synchronize, reopened]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fingerprint and official checks
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          sha256sum docs/index.html docs/version.json > qa-evidence/SHA256.txt
          echo 'dc43e47daa950f5f8a2f721140017045553b6173ccd7b41ac59998001fbeeadb  docs/index.html' | sha256sum -c -
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          python3 tools/scan_secrets.py | tee qa-evidence/security.txt
          python3 tools/check_index.py docs/index.html | tee qa-evidence/html.txt
      - name: Install test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Navigation browser tests
        run: python3 design/atelier/qa/r1a.py
      - name: Category and selected-count browser tests
        if: ${{ !cancelled() }}
        run: python3 design/atelier/qa/r1b.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-r1b-evidence
          path: qa-evidence/
          retention-days: 7
  storage-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Exact candidate and generic application regressions
        run: |
          python - <<'PY'
          import hashlib, json, shutil, threading, tempfile, traceback, subprocess
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          evidence=Path('qa-regression-evidence')
          evidence.mkdir(exist_ok=True)
          html=Path('docs/index.html')
          assert hashlib.sha256(html.read_bytes()).hexdigest()=='dc43e47daa950f5f8a2f721140017045553b6173ccd7b41ac59998001fbeeadb'
          assert hashlib.sha256(Path('docs/version.json').read_bytes()).hexdigest()=='46bea6645a530ea8ab33437d334b0c598a1d93e217f7c44dc666cf4364751e7a'
          results=[]
          fingerprints={}
          for file,expected_blob in [('docs/index.html','ecada16cc5b675934b638d24c6cff92702ecd3eb'),('docs/version.json','3cc74b2226730009d09703c6de9c7830ac6da30f')]:
            blob=subprocess.check_output(['git','hash-object',file],text=True).strip()
            assert blob==expected_blob, (file,blob)
            fingerprints[file]={'blob':blob,'sha256':hashlib.sha256(Path(file).read_bytes()).hexdigest()}
          (evidence/'fingerprints.json').write_text(json.dumps(fingerprints,indent=2))
          print(json.dumps(fingerprints),flush=True)
          with tempfile.TemporaryDirectory() as td:
            root=Path(td)
            shutil.copyfile(html,root/'index.html')
            server=ThreadingHTTPServer(('127.0.0.1',0),partial(SimpleHTTPRequestHandler,directory=td))
            threading.Thread(target=server.serve_forever,daemon=True).start()
            origin=f'http://127.0.0.1:{server.server_port}'
            try:
              with sync_playwright() as w:
                browser=w.chromium.launch()
                for width,height in [(476,660),(839,660),(840,660),(933,612)]:
                  p=None
                  phase='context setup'
                  def boot(path='index.html',normalize=True):
                    global phase
                    phase=f'boot {path}: goto'
                    p.goto(origin+'/'+path,wait_until='load')
                    phase=f'boot {path}: route readiness'
                    p.wait_for_function("typeof window.rdV30Route==='function'")
                    phase=f'boot {path}: builder route'
                    p.evaluate("rdV30Route('builder')")
                    if normalize:
                      phase=f'boot {path}: step-1'
                      p.evaluate("jumpToStep('step-1')")
                    phase=f'boot {path}: count card visibility'
                    p.locator('[data-detail=count]').wait_for(state='visible')
                  def state():return p.evaluate('JSON.stringify(captureState())')
                  def undo():return p.evaluate('undoStack.length')
                  def run(name,fn):
                    global p,phase
                    phase='context setup'
                    c=browser.new_context(viewport={'width':width,'height':height},reduced_motion='reduce',accept_downloads=True,service_workers='block')
                    errors=[]
                    try:
                      c.route('**/*',lambda r:r.continue_() if r.request.url.startswith(origin+'/') and r.request.method in ('GET','HEAD') else r.abort())
                      p=c.new_page()
                      p.set_default_timeout(12000)
                      p.on('pageerror',lambda e:errors.append(str(e)))
                      fn()
                      row={'viewport':[width,height],'test':name,'status':'PASS'}
                    except Exception as e:
                      row={'viewport':[width,height],'test':name,'status':'FAIL','phase':phase,'error_type':type(e).__name__,'error_message':str(e),'traceback':traceback.format_exc()}
                    finally:
                      c.close()
                    row['page_errors']=errors
                    if errors:row['status']='FAIL'
                    results.append(row)
                    print(json.dumps(row),flush=True)
                    (evidence/'results.json').write_text(json.dumps(results,indent=2))
                  def navigation():
                    global phase
                    boot()
                    phase='navigation state and undo'
                    initial=state()
                    u=undo()
                    p.locator('[data-detail=count]').click()
                    p.locator('#group-count .chip[data-val=solo]').click()
                    p.locator('#rd304-detail-done').click()
                    assert p.evaluate("captureState().count")=='solo'
                    assert undo()==u+1
                    selected=state()
                    p.evaluate("jumpToStep('step-2')")
                    p.locator('[data-detail=pose]').click()
                    p.locator('[data-scene-stage=category] .d32-facet').first.click()
                    assert state()==selected and undo()==u+1
                    p.locator('.d3-foot button:visible').filter(has_text='건너뛰기').click()
                    assert state()==selected and undo()==u+1
                    p.evaluate('undoLast()')
                    assert state()==initial and undo()==u
                  def storage():
                    global phase
                    boot()
                    phase='backup restore and IndexedDB reads'
                    p.evaluate("""async()=>{
                      await rd210LoadThumbs();
                      await cardThumbs.list();
                      const data={presets:[{name:'QA neutral',state:captureState()}]};
                      restoreBackup(data);
                    }""")
                    phase='backup reload and persistence'
                    before=p.evaluate('JSON.stringify(readPresets())')
                    p.reload(wait_until='load')
                    p.wait_for_function("typeof window.rdV30Route==='function'")
                    assert p.evaluate('JSON.stringify(readPresets())')==before
                    phase='backup export download'
                    with p.expect_download(timeout=20000) as di:
                      p.evaluate('()=>{void exportSettings()}')
                    phase='backup exported JSON assertions'
                    path=Path(td)/f'backup-{width}.json'
                    di.value.save_as(path)
                    data=json.loads(path.read_text())
                    assert data['presets'][0]['name']=='QA neutral'
                    assert 'artistThumbs' in data and 'cardCovers' in data
                    assert data['presets'][0]['state']['schemaVersion']==2
                    path.unlink()
                  def resave():
                    global phase
                    boot()
                    for i in (1,2):
                      phase=f'HTML generation {i}: download'
                      with p.expect_download(timeout=20000) as di:
                        p.evaluate('()=>{downloadSelfHTML()}')
                      filename=f'roundtrip-{width}-{i}.html'
                      di.value.save_as(root/filename)
                      phase=f'HTML generation {i}: file size'
                      assert (root/filename).stat().st_size>200000
                      boot(filename)
                      phase=f'HTML generation {i}: reopened DOM assertions'
                      assert p.locator('#group-count').count()==1
                      assert p.evaluate("typeof window.downloadSelfHTML==='function'")
                      (root/filename).unlink()
                  def reproduce():
                    global phase
                    navigation()
                    diagnostic={'viewport':[width,height],'prior_run':46038439375,'before_reload':p.locator('[data-detail=count]').is_visible()}
                    try:
                      boot(normalize=False)
                      diagnostic['outcome']='NOT_REPRODUCED'
                    except Exception as e:
                      diagnostic.update(outcome='REPRODUCED' if type(e).__name__=='TimeoutError' and phase.endswith('count card visibility') else 'OTHER_ERROR',phase=phase,error_type=type(e).__name__,error_message=str(e),traceback=traceback.format_exc())
                    diagnostic['after_legacy_boot_count_visible']=p.locator('[data-detail=count]').is_visible()
                    print(json.dumps(diagnostic),flush=True)
                    (evidence/'legacy-boot-reproduction.json').write_text(json.dumps(diagnostic,indent=2))
                    phase='reproduction recovery: explicit step-1'
                    p.evaluate("jumpToStep('step-1')")
                    p.locator('[data-detail=count]').wait_for(state='visible')
                  if width==476:run('legacy boot diagnostic and recovery',reproduce)
                  run('native app backup read, preset restore and reload',storage)
                  if width in (476,933):run('two generation HTML save and reopen',resave)
                browser.close()
            finally:
              server.shutdown()
          (evidence/'results.json').write_text(json.dumps(results,indent=2))
          assert len(results)==7, results
          assert all(r['status']=='PASS' for r in results), 'Regression failed: see results'
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-regression-evidence
          path: qa-regression-evidence/
          retention-days: 7
