name: ATELIER R1a navigation QA
on:
  push:
    branches: ['qa/v3.3.0-atelier']
    paths: ['docs/index.html','.github/workflows/atelier-r1a-qa.yml','design/atelier/qa/r1a.py']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  navigation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fingerprint and official checks
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          sha256sum docs/index.html docs/version.json > qa-evidence/SHA256.txt
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          python3 tools/scan_secrets.py | tee qa-evidence/security.txt
          python3 tools/check_index.py docs/index.html | tee qa-evidence/html.txt
      - name: Install test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Navigation browser tests
        run: python3 design/atelier/qa/r1a.py
      - name: Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atelier-r1a-evidence
          path: qa-evidence/
          retention-days: 7
