name: Android APK

on:
  push:
    branches: [main, 'qa/android-v1.2']
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["apk-v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Secret scan
        run: python3 tools/scan_secrets.py
      - name: Restore release keystore (repo secrets, optional)
        env:
          KS_B64: ${{ secrets.RD_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "RD_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNED=1" >> "$GITHUB_ENV"
          else
            echo "::warning::RD_KEYSTORE_B64 secret 없음 → 서명 안 된 APK(빌드 확인용)만 만듦. 설치용 APK는 같은 키로 서명해야 함."
          fi
      - name: Build
        working-directory: android
        env:
          RD_KEYSTORE_PASSWORD: ${{ secrets.RD_KEYSTORE_PASSWORD }}
          RD_KEY_ALIAS: ${{ secrets.RD_KEY_ALIAS }}
          RD_KEY_PASSWORD: ${{ secrets.RD_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - name: Rename
        run: |
          V=$(grep -m1 versionName android/app/build.gradle | sed -E 's/.*"(.*)".*/\1/')
          F=android/app/build/outputs/apk/release
          if [ "$SIGNED" = "1" ]; then cp $F/app-release.apk "my-builder-$V.apk"; else cp $F/app-release-unsigned.apk "my-builder-$V-unsigned.apk"; fi
          ls -la *.apk
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: "*.apk"
      - name: QA signature, package and SHA-256 (QA branch only)
        if: github.ref == 'refs/heads/qa/android-v1.2'
        shell: bash
        run: |
          set -euo pipefail
          test "$SIGNED" = "1" || { echo "::error::Existing release signing secrets unavailable"; exit 1; }
          APK=my-builder-1.2.apk
          test -f "$APK"
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          TOOLS="$(find "$SDK/build-tools" -type f -name apksigner -printf '%h\n' | sort -V | tail -n1)"
          mkdir -p qa-evidence
          "$TOOLS/apksigner" verify --verbose --print-certs "$APK" | tee qa-evidence/signature.txt
          "$TOOLS/aapt" dump badging "$APK" > qa-evidence/badging.txt
          grep -F "package: name='app.mybuilder' versionCode='3' versionName='1.2'" qa-evidence/badging.txt
          sha256sum "$APK" | tee qa-evidence/SHA256.txt
          git rev-parse HEAD > qa-evidence/qa-commit.txt
          git fetch --no-tags origin 391c14b64e64378d90a83ffee4494c5fb5369392
          git diff --binary 391c14b64e64378d90a83ffee4494c5fb5369392 HEAD -- android docs/version.json > qa-evidence/product.diff
          git archive --format=zip --output=qa-evidence/product-source.zip HEAD android docs/version.json
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/qa/android-v1.2'
        with:
          name: android-qa-evidence
          path: qa-evidence/
      - name: Attach to release (tag apk-v*, signed only)
        if: startsWith(github.ref, 'refs/tags/apk-v') && env.SIGNED == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" *.apk --title "${GITHUB_REF_NAME}" --notes "My Builder APK" || gh release upload "${GITHUB_REF_NAME}" *.apk --clobber
