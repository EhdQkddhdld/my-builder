name: My Builder Auto QA - smoke

on:
  push:
    branches: ['qa/**']

permissions:
  contents: read

concurrency:
  group: auto-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Official checks and fingerprint
        run: |
          set -euo pipefail
          mkdir -p qa-evidence
          git rev-parse HEAD > qa-evidence/commit.txt
          sha256sum docs/index.html docs/version.json > qa-evidence/SHA256.txt
          git diff --check "$(git merge-base HEAD origin/main)" HEAD
          python3 tools/scan_secrets.py | tee qa-evidence/security.txt
          python3 tools/check_index.py docs/index.html | tee qa-evidence/html.txt
      - name: Install isolated browser test dependency
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: HTTP and native browser storage smoke test
        run: |
          python - <<'PY'
          import json, threading, uuid
          from pathlib import Path
          from functools import partial
          from http.server import ThreadingHTTPServer, SimpleHTTPRequestHandler
          from playwright.sync_api import sync_playwright
          root = Path.cwd()
          evidence = root / 'qa-evidence'
          server = ThreadingHTTPServer(('127.0.0.1', 0), partial(SimpleHTTPRequestHandler, directory=str(root / 'docs')))
          threading.Thread(target=server.serve_forever, daemon=True).start()
          origin = f'http://127.0.0.1:{server.server_port}'
          report = []
          failures = []
          try:
              with sync_playwright() as pw:
                  browser = pw.chromium.launch()
                  for width, height in [(476,660),(839,660),(840,660),(933,612)]:
                      result = {'viewport': [width,height], 'status':'FAIL'}
                      context = browser.new_context(viewport={'width':width,'height':height}, reduced_motion='reduce', service_workers='block', accept_downloads=False)
                      context.route('**/*', lambda r: r.continue_() if r.request.url.startswith(origin + '/') and r.request.method in ('GET','HEAD') else r.abort())
                      page = context.new_page()
                      page.set_default_timeout(10000)
                      errors = []
                      page.on('pageerror', lambda e: errors.append(type(e).__name__))
                      probe = '__autoqa_' + uuid.uuid4().hex
                      try:
                          response = page.goto(origin+'/index.html', wait_until='load')
                          assert response is not None and response.ok, 'HTTP response failed'
                          page.wait_for_function("typeof window.rdV30Route === 'function'")
                          assert page.evaluate("location.protocol === 'http:' && !!window.indexedDB && !!window.localStorage")
                          page.evaluate("""async key => {
                            localStorage.setItem(key,'ok');
                            await new Promise((resolve,reject)=>{
                              const r=indexedDB.open(key,1);
                              r.onupgradeneeded=()=>r.result.createObjectStore('probe');
                              r.onerror=()=>reject(r.error);
                              r.onsuccess=()=>{const db=r.result;const t=db.transaction('probe','readwrite');t.objectStore('probe').put('ok','k');t.oncomplete=()=>{db.close();resolve()};t.onerror=()=>{db.close();reject(t.error)};t.onabort=t.onerror};
                            });
                          }""", probe)
                          page.reload(wait_until='load')
                          storage = page.evaluate("""async key => {
                            const local=localStorage.getItem(key)==='ok';
                            const idb=await new Promise((resolve,reject)=>{
                              const r=indexedDB.open(key,1);
                              r.onerror=()=>reject(r.error);
                              r.onupgradeneeded=()=>{r.transaction.abort()};
                              r.onsuccess=()=>{const db=r.result;const t=db.transaction('probe','readonly');const q=t.objectStore('probe').get('k');let ok=false;q.onsuccess=()=>{ok=q.result==='ok'};t.oncomplete=()=>{db.close();resolve(ok)};t.onerror=()=>{db.close();reject(t.error)};t.onabort=t.onerror};
                            });
                            localStorage.removeItem(key);
                            await new Promise((resolve,reject)=>{const r=indexedDB.deleteDatabase(key);r.onsuccess=()=>resolve();r.onerror=()=>reject(r.error);r.onblocked=()=>reject(new Error('probe cleanup blocked'))});
                            return {local,idb};
                          }""", probe)
                          assert storage == {'local':True,'idb':True}, 'storage persistence failed'
                          result['native_storage_probe'] = storage
                          page.wait_for_function("typeof window.rdV30Route === 'function'")
                          page.evaluate("window.rdV30Route('builder')")
                          page.locator('[data-detail=count]').wait_for(state='visible')
                          page.screenshot(path=str(evidence/f'builder-{width}.png'), animations='disabled')
                          assert page.evaluate('document.documentElement.scrollWidth <= innerWidth + 1'), 'horizontal overflow'
                          assert not errors, 'uncaught browser error'
                          result['status']='PASS'
                      except Exception as exc:
                          result['error_type']=type(exc).__name__
                          failures.append(width)
                      finally:
                          result['uncaught_error_count']=len(errors)
                          report.append(result)
                          context.close()
                          (evidence/'browser.json').write_text(json.dumps(report,indent=2),encoding='utf-8')
                          print(json.dumps(result),flush=True)
                  browser.close()
          finally:
              server.shutdown()
          assert not failures, f'Failed viewports: {failures}'
          PY
      - name: Retain evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: auto-qa-evidence
          path: qa-evidence/
          if-no-files-found: warn
          retention-days: 7
